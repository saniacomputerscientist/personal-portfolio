<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact form</title>
            <link rel="stylesheet" href="style2.css">
</head>
    <body>
    <div style="text-align: center;">
        <center>
            <h1> Contact form</h1><br>
            <!-- action ke andar apni sahi Gmail id likhein -->
<form action="https://formspree.io/f/mwlvyyjg"method="POST">
                <label><b>Your name</b></label>
                <br>
                <input type="text" name="name" placeholder="Enter your full name" style="width: 85%;  max-width: 350px;  padding :10px; font-size:16px;" >
                <br><br>
            <label><b>Contact Number</b></label>
            <br>
                <input type="text" name="Contact Number" placeholder="Entre your phone number" style="width: 85%;  max-width: 350px;  padding :10px; font-size:16px;" >
                <br><br>
                <label><b>Email</b></label>
                <br>
                <input type="email" name="email" placeholder="Drop your Email" style="width: 85%;  max-width: 350px;  padding :10px; font-size:16px;" >
                <br><br>
                <Label><b>Reason for Contact</b></Label>
                <br>
                <select name="reason" style="width: 85%;  max-width: 375px;  padding :10px; font-size:16px; display:inline-block;">
                    <option> Website Development</option><br>
            <option> Freelance Work</option><br>
            <option> Job Opportunity</option><br>
            <option> Project Collaboration</option><br>
            <option> Website Help / Bug fix</option><br>
            <option> Just saying Hi !</option><br>
            <option> Other ( specify in massege)</option><br>
                </select>
                <br><br>
                <label><b>Feedback</b></label><br>
                <textarea name="message" rows="5" placeholder="Type your message here....."  style="width: 85%;  max-width: 350px;  padding :10px; font-size:18px;" ></textarea>
                <br><br>
        
                <br>
                <input type="submit" value="submit">
                </form>
                </centre>
                </div>


                


        
                
        

            </form>
        </centre>
    </div> 

    
</body>
</html>
