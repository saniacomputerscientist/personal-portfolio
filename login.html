<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>

     <div style="text-align: center;">
</head>
<body>
    <!-- Login Form Section -->
<center>
    <h2>Login Form</h2>
        
        <!-- Email Input -->
        <label for="login-email">Email:</label><br>
        <input type="email" id="login-email" name="email" placeholder="Enter your email" required  style="width: 85%;  max-width: 350px;  padding :10px; font-size:16px;" >
           <br><br>

        <!-- Password Input -->
        <label for="login-password">Password:</label><br>
        <input type="password" id="login-password" name="password" placeholder="Enter your password" required style="width: 85%;  max-width: 350px;  padding :10px; font-size:16px;" >
           <br><br>

        <!-- Submit Button -->
        <button type="submit">Login</button>
        
    </form>
</div>
</center>
</body>
</html>
