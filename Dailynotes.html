
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sania's Daily Tech Tracker</title>
            <link rel="stylesheet" href="style.css">

</head>
<body>

    <!-- Main Heading -->
    <header>
        <h1>🎯 My Coding Desk</h1>
        <p>Current Status: <strong>Learning & Growing Every Day</strong></p>
    </header>

    <hr>

    <!-- Interactive Section (Form Layout) -->
    <main>
        <section>
            <h2>💡 Today's Tech Motivation</h2>
            <blockquote>
                "Every great developer white-boarding complex systems started by writing simple HTML lines."
            </blockquote>
        </section>

        <br>

        <section>
            <h2>📝 Add My Thoughts / To-Do List</h2>
            <form action="#">
                <label for="task">What did I learn today?</label><br>
                <input type="text" id="task" placeholder="e.g., HTML Form Inputs, GitHub Commits" size="40">
                <br><br>

                <label for="difficulty">How was the experience?</label><br>
                <select id="difficulty">
                    <option value="easy">Easy Peasy</option>
                    <option value="challenging">Challenging but fun</option>
                    <option value="hard">Stuck in a reCAPTCHA loop!</option>
                </select>
                <br><br>

                <label for="notes">Quick Notes:</label><br>
                <textarea id="notes" rows="4" cols="40" placeholder="Write down any reminders here..."></textarea>
                <br><br>

                <button type="submit">Save Log</button>
            </form>
        </section>
    </main>

    <hr>

    <!-- Back to Portfolio Link -->
    <footer>
        <p>👈 <a href="index.html">Back to Main Portfolio</a></p>
    </footer>

</body>
</html>

    
</body>
</html>
